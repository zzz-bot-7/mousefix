# MouseFix config
# Copy to ~/.config/mousefix/config.yaml
#
# Button numbers: run `mousefix discover` to see what number each button reports.
# MX Master 4 defaults are pre-filled below.
#
# Actions:
#   "Cmd+Z"          any keyboard shortcut (Cmd, Ctrl, Shift, Opt + key)
#   "Cmd"            hold Command for as long as the mouse button is held
#   "Shift"          hold Shift for as long as the mouse button is held
#   "MiddleClick"    native middle click
#   "LaserPointer"   laser pointer circle while held
#   "MissionControl" trigger Mission Control
#   "AppExpose"      trigger App Expose (current app windows)
#   "ShowDesktop"    trigger Show Desktop
#   "None"           disable the button

# Map macOS button numbers to actions.
# Left-click (0) and right-click (1) can't be remapped.
buttons:
  2: "MiddleClick"          # Middle click (scroll wheel press)
  3: "Cmd+Z"                # Back thumb -> Undo
  4: "Cmd"                  # Below screenshot -> hold Command
  5: "Cmd+Shift+4"          # Screenshot
  6: "None"                 # Large thumb button is handled by gesture config

# The below-scroll SmartShift button is Logitech HID++ control 0x00C4, not a
# standard macOS button number. MouseFix reserves it for the laser pointer.

# Hardware discovery confirms the large thumb control is macOS button 6.
gesture:
  button: 6
  logitech_control: false
  click: "Cmd+Tab"           # Tap -> App Switcher
  hold_left: "Ctrl+Right"   # Hold + swipe left -> Space right
  hold_right: "Ctrl+Left"   # Hold + swipe right -> Space left
  hold_up: "MissionControl"  # Hold + swipe up -> Mission Control
  hold_down: "AppExpose"    # Hold + swipe down -> App Expose

# Side wheel behaves like repeated Left/Right Arrow presses.
tilt_scroll:
  left: "Left"
  right: "Right"

# Smooth only the configured physical mouse. Trackpad scroll events pass
# through untouched, including Apple's own gesture and momentum phases.
scroll:
  enabled: true
  device: "mx master"
  response: 0.68
  speed: 1.0

# Haptic feedback (Logitech HID++ devices only).
# Device name is a substring match, case-insensitive.
# haptic:
#   device: "mx master"
